[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "street-graph-routing-osmnx"
version = "0.1.0"
description = "Dijkstra and A* with a haversine heuristic on an OpenStreetMap drive network (Manhattan)."
requires-python = ">=3.11"
dependencies = [
    "routes-pricing-shared==0.1.0",
    "pandas==2.3.3",
    "numpy==2.2.6",
    "matplotlib==3.10.7",
    "networkx==3.5",
    "osmnx==2.0.7",
    "geopandas==1.1.2",
    "contextily==1.6.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "jupytext==1.17.3", "nbconvert==7.16.6", "nbclient==0.10.2", "ipykernel==6.30.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
